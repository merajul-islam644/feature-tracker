                        - strong [ref=f12e216]: Ask when the user is implicitly delegating judgment.
                        - text: If they say “Pick the best option,” repeatedly asking them to define “best” defeats the point. I should choose a criterion that seems reasonable, explain it, and let them correct me.
                      - listitem [ref=f12e217]:
