                  - button [ref=f36e362] [cursor=pointer]:
                    - paragraph [ref=f36e363]: "\"Cross-product abstractions\" is the right frame and I'll concede the diagnosis — the cost isn't any one boundary, it's the combinatorics between them. And your one-sentence version is sharper than mine. But your Web Components pick undercuts your own argument. You praise them as a durable platform-level boundary, yet the reason they lost is precisely a cross-product problem: they have no answer for state that crosses element boundaries, SSR was an afterthought for a decade (declarative shadow DOM only landed recently), and form participation required a separate spec. A design system built on custom elements typically ends up shipping Lit — at which point the \"no shared framework\" promise is gone and you have a framework with worse ergonomics. Durability you never get to use isn't durability. Two questions: 1. Name the specific failure you'd expect if a team adopted Web Components for a design system today. Not the theory — what actually breaks in month six? 2. You went safe on \"overrated.\" GraphQL-is-overused has been consensus since roughly 2021. Give me a genuinely unpopular overrated pick — something the field currently believes in."
