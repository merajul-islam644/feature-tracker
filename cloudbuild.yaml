# Cloud Build pipeline for the Feature Tracker Vite SPA.
#
# Trigger configuration:
#   1. Cloud Console → Cloud Build → Triggers → Create trigger.
#   2. Source: connect this repo (merajul-islam644/feature-tracker), branch
#      `^pre-dev$` (or whatever you want to deploy from).
#   3. Configuration: Type = "Cloud Build configuration file (yaml or json)",
#      Location = `cloudbuild.yaml` (do NOT use "Dockerfile" type — that
#      switches the trigger to invoke kaniko directly with a single --dockerfile
#      flag, which is what was failing before with
#      "error resolving dockerfile path").
#   4. Substitutions: set the ones listed under `substitutions:` below. The
#      `_VITE_BLOCKS_*` values must come from your tenant's config (resolve
#      via `blocks projects get --json` and
#      `blocks auth oidc-clients list --json` from a terminal).
#   5. Service account: needs Artifact Registry Writer + Cloud Run Admin
#      (the latter only if you set `_SERVICE`).
#
# Pipeline:
#   1. npm ci              — installs deps from package-lock.json
#   2. tsc --noEmit        — type-check (fails fast on type errors)
#   3. vite build          — produces dist/, inlines VITE_BLOCKS_* env
#   4. docker build        — multi-stage Dockerfile; nginx serves dist/
#   5. docker push         — to Artifact Registry (declared in images:)
#
# Required substitutions:
#   _VITE_BLOCKS_API_URL          e.g. https://blocksapi.slsblx.com
#   _VITE_BLOCKS_KEY              tenant key (x-blocks-key)
#   _VITE_BLOCKS_OIDC_CLIENT_ID   public OIDC client id
#   _VITE_BLOCKS_OIDC_URL         tenant OIDC discovery URL
#   _VITE_BLOCKS_APP_DOMAIN       e.g. https://dbeegi.slsblx.com
# Optional:
#   _VITE_BLOCKS_OIDC_SCOPE       defaults to "openid profile"
#   _REGION                       defaults to us-central1
#   _REPOSITORY                   defaults to feature-tracker

# Top-level substitutions. Defaults fill in only when the trigger doesn't
# pass a value of its own.
#
# Per-env wiring — empty defaults below let the build complete even when
# the corresponding Block-portal trigger substitution isn't set yet. The
# deployed SPA then returns 503 from the affected /api/* route until
# someone sets the substitution in the Block portal (Build → Trigger →
# Substitutions) and re-deploys. Setting values here is equivalent to
# setting them in the portal — the portal wins on deploy.
substitutions:
  _VITE_BLOCKS_OIDC_SCOPE: "openid profile"
  _REGION: "us-central1"
  _REPOSITORY: "feature-tracker"

# Top-level images — Cloud Build pushes these after the build succeeds.
# The tag uses branch + short SHA + build id so every build is unique.
# Single image: the frontend SPA (feature-tracker) now also bundles the
# mcp-server (single-container architecture). prod-backend.mjs spawns
# mcp-server as a child process at startup.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/feature-tracker:${BRANCH_NAME##*/}-${SHORT_SHA}-${BUILD_ID}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  # Default disk is 100GB; npm + node_modules doesn't need that much.
  diskSizeGb: 20

steps:
  # ── 1. install ──────────────────────────────────────────────────────────
  # Single container → two `npm ci` runs: frontend + mcp-server. The
  # Dockerfile copies mcp-server's node_modules from the deps cache, so
  # the image-mcp step is gone (mcp-server is built INTO the same
  # image). Both lockfiles are committed, so the build is reproducible.
  - id: install
    name: gcr.io/cloud-builders/npm
    entrypoint: sh
    args:
      - "-c"
      - |
        npm ci
        cd mcp-server && npm ci
    dir: "."

  # ── 2. typecheck ────────────────────────────────────────────────────────
  - id: typecheck
    name: gcr.io/cloud-builders/npm
    entrypoint: npm
    args: ["run", "typecheck"]
    dir: "."
    waitFor: ["install"]

  # ── 3. build the static SPA into dist/ ──────────────────────────────────
  # Vite inlines VITE_BLOCKS_* env at build time — these MUST be set as
  # build-step env vars, not as runtime Cloud Run env vars (the bundle has
  # no access to those).
  - id: build
    name: gcr.io/cloud-builders/npm
    entrypoint: npm
    args: ["run", "build"]
    dir: "."
    env:
      - "VITE_BLOCKS_API_URL=${_VITE_BLOCKS_API_URL}"
      - "VITE_BLOCKS_KEY=${_VITE_BLOCKS_KEY}"
      - "VITE_BLOCKS_OIDC_CLIENT_ID=${_VITE_BLOCKS_OIDC_CLIENT_ID}"
      - "VITE_BLOCKS_OIDC_URL=${_VITE_BLOCKS_OIDC_URL}"
      - "VITE_BLOCKS_OIDC_SCOPE=${_VITE_BLOCKS_OIDC_SCOPE}"
      - "VITE_BLOCKS_APP_DOMAIN=${_VITE_BLOCKS_APP_DOMAIN}"
    waitFor: ["typecheck"]

  # ── 4. build the SPA container image ────────────────────────────────────
  # The Dockerfile is multi-stage (deps → build → runtime). prod-backend.mjs
  # spawns mcp-server as a child process at startup, so the runtime image
  # contains both. No mcp-server-specific build args — its only env
  # requirement (MCP_PORT=8787) is hardcoded in the spawn block.
  - id: image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/feature-tracker:${BRANCH_NAME##*/}-${SHORT_SHA}-${BUILD_ID}"
      - "--build-arg=VITE_BLOCKS_API_URL=${_VITE_BLOCKS_API_URL}"
      - "--build-arg=VITE_BLOCKS_KEY=${_VITE_BLOCKS_KEY}"
      - "--build-arg=VITE_BLOCKS_OIDC_CLIENT_ID=${_VITE_BLOCKS_OIDC_CLIENT_ID}"
      - "--build-arg=VITE_BLOCKS_OIDC_URL=${_VITE_BLOCKS_OIDC_URL}"
      - "--build-arg=VITE_BLOCKS_OIDC_SCOPE=${_VITE_BLOCKS_OIDC_SCOPE}"
      - "--build-arg=VITE_BLOCKS_APP_DOMAIN=${_VITE_BLOCKS_APP_DOMAIN}"
      - "--file=Dockerfile"
      - "."
    dir: "."
    waitFor: ["build"]

  # ── 5. push to Artifact Registry ─────────────────────────────────────────
  # Implicit: declared in `images:` at the top of this file.

  # ── 6. optional Cloud Run deploy ────────────────────────────────────────
  # Runs only when the trigger passes a _SERVICE substitution. Same
  # pipeline serves both "build image only" (omitting _SERVICE) and
  # "build + deploy" workflows without duplicating config. The single
  # deployed service runs BOTH prod-backend.mjs and the mcp-server
  # child process.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - "-c"
      - |
        if [ -n "${_SERVICE}" ]; then
          gcloud run deploy "${_SERVICE}" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/feature-tracker:${BRANCH_NAME##*/}-${SHORT_SHA}-${BUILD_ID}" \
            --region="${_REGION}" \
            --platform=managed \
            --allow-unauthenticated
        else
          echo "_SERVICE not set — skipping Cloud Run deploy"
        fi
    dir: "."
    waitFor: ["image"]
