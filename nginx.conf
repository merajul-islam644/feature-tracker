# Nginx config for the Feature Tracker SPA.
#
# Conventions:
#   * Listen on 8080 (Cloud Run / distroless-friendly default; no special
#     privilege needed).
#   * SPA fallback: any path that doesn't match a file in /usr/share/nginx/html
#     is rewritten to /index.html so client-side routes survive a refresh.
#   * index.html is NEVER cached so deploys pick up new bundles immediately.
#   * Hashed asset filenames under /assets/* get a long cache lifetime —
#     they're content-addressed, so a new deploy will produce new filenames.
#   * gzip on text responses.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text responses.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Never cache index.html — deploys must be picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # Hashed assets get long-lived caching.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: any unknown path is served as index.html so React Router
  # can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
